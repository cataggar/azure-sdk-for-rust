[workspace]
resolver = "2"
members = [
  "codegen",
  "codegen-types",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"
anyhow = "1.0"
wasmtime = { version = "42.0", features = ["component-model"] }
wit-bindgen = "0.53"
